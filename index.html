    <meta property="og:description" content="NASA Space Apps Challenge 2026 prototype by Quanta Buddies: Advanced AI-powered Martian Map, GIS layers, A* rover/EVA pathfinding, RAG mission assistant, and hazard detection." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress benign WebSocket/HMR disconnection errors in sandboxed iframe environment
      const origError = console.error;
      console.error = function (...args) {
        const msg = args.map(String).join(' ');
        if (
          msg.includes('WebSocket') ||
          msg.includes('websocket') ||
          msg.includes('WebSocket closed without opened')
        ) {
          return;
        }
        origError.apply(console, args);
      };

      const origWarn = console.warn;
      console.warn = function (...args) {
        const msg = args.map(String).join(' ');
        if (msg.includes('THREE.Clock: This module has been deprecated')) {
          return;
        }
        origWarn.apply(console, args);
      };

      window.addEventListener('unhandledrejection', function (event) {
        try {
          var str = String((event && event.reason && (event.reason.message || event.reason)) || '');
          if (
            str.toLowerCase().indexOf('websocket') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('failed to connect') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        } catch (e) {}
      }, true);
      window.addEventListener('error', function (event) {
        try {
          var str = String((event && (event.message || (event.error && event.error.message))) || '');
          if (
            str.toLowerCase().indexOf('websocket') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('failed to connect') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        } catch (e) {}
      }, true);
    </script>
  </head>

  </body>
</html>
