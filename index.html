    <script>
      // Suppress benign WebSocket/HMR disconnection, ResizeObserver layout loop notifications, and sandboxed iframe errors
      function isBenignError(str) {
        if (!str || !str.trim()) return true;
        var lower = str.toLowerCase();
        return (
          lower.indexOf('websocket') !== -1 ||
          lower.indexOf('closed without opened') !== -1 ||
          lower.indexOf('failed to connect') !== -1 ||
          lower.indexOf('resizeobserver') !== -1 ||
          lower.indexOf('undelivered notifications') !== -1 ||
          lower.indexOf('loop limit exceeded') !== -1 ||
          lower.indexOf('script error') !== -1
        );
      }
      window.addEventListener('unhandledrejection', function (event) {
        try {
          var str = String((event && event.reason && (event.reason.message || event.reason)) || '');
          if (isBenignError(str)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        } catch (e) {}
      }, true);
      window.addEventListener('error', function (event) {
        try {
          var str = String((event && (event.message || (event.error && event.error.message))) || '');
          if (isBenignError(str)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        } catch (e) {}
      }, true);
    </script>
